# Publica en Vercel en cada push a main.
# Secretos del repo: VERCEL_TOKEN, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN.
# Opcionales: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (login con Google) y
# ADMIN_EMAIL (emails separados por comas que quedan como administradores).
# El build remoto corre `vercel-build` (migraciones + catálogo + next build).
name: Deploy a Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "Faltan secretos (VERCEL_TOKEN, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN); no se publica."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env TURSO_DATABASE_URL="$TURSO_DATABASE_URL" \
            --build-env TURSO_AUTH_TOKEN="$TURSO_AUTH_TOKEN" \
            --env TURSO_DATABASE_URL="$TURSO_DATABASE_URL" \
            --env TURSO_AUTH_TOKEN="$TURSO_AUTH_TOKEN" \
            --build-env GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --build-env GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --env GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --env GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --build-env ADMIN_EMAIL="$ADMIN_EMAIL" \
            --env ADMIN_EMAIL="$ADMIN_EMAIL"
